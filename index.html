    <script>
        const AlarmSoundEngine = {
            playAlert() {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gain.gain.setValueAtTime(0.5, ctx.currentTime);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 1.2);
                } catch(e) { console.log("Audio standby."); }
            }
        };
    </script>

    <script>
        const AppState = {
            activeView: 'dashboard',
            activeChartTab: 'programming',
            settings: { googleWebappUrl: '' },
            modules: {
                dashboard: {},
                programming: [],       
                content_creation: [],  
                books: [],             
                notes: [],             
                workout: [],           
                finance: [], 
                alarms: [],
                habits: []
            },
            focusSession: { timerId: null, remainingSeconds: 0, activeTopic: '', totalDurationMins: 0 },
            utilityStopwatch: { timerId: null, elapsedSeconds: 0, isRunning: false }
        };

        const SystemModulesDefinition = {
            dashboard: { label: 'Dashboard', icon: 'ti-smart-home', color: 'indigo' },
            programming: { label: 'Programming', icon: 'ti-code-asterisk', color: 'violet' },
            content_creation: { label: 'Content Creator', icon: 'ti-video', color: 'fuchsia' },
            books: { label: 'Book Shelf', icon: 'ti-book-2', color: 'amber' },
            notes: { label: 'Notes Vault', icon: 'ti-notebook', color: 'teal' }, 
            workout: { label: 'Workouts', icon: 'ti-barbell', color: 'emerald' }, 
            finance: { label: 'Finance Center', icon: 'ti-cash-banknote', color: 'rose' },
            habits: { label: 'Habits Grid', icon: 'ti-calendar-repeat', color: 'cyan' },
            utilities: { label: 'Time Center', icon: 'ti-clock', color: 'sky' }
        };

        let globalChartInstance = null;

        const StorageController = {
            STORAGE_KEY: 'DAILY_LIFE_TRACKER_DATA_SOHAIB_V5',

            init() {
                try {
                    const localData = localStorage.getItem(this.STORAGE_KEY);
                    if (localData) {
                        const parsed = JSON.parse(localData);
                        if (parsed.modules) {
                            AppState.settings = parsed.settings || { googleWebappUrl: '' };
                            Object.keys(AppState.modules).forEach(key => {
                                if (parsed.modules[key]) AppState.modules[key] = parsed.modules[key];
                            });
                        }
                    }
                    this.saveToDisk();
                } catch (error) { console.error("Database load collision:", error); }
            },

            saveToDisk() {
                try {
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify({ settings: AppState.settings, modules: AppState.modules }));
                } catch (error) { console.error("Disk save failure:", error); }
            },

            async syncToCloud() {
                const url = AppState.settings.googleWebappUrl;
                if (!url || !navigator.onLine) return; 
                const indicator = document.getElementById('sync-status-indicator');
                const indicatorMob = document.getElementById('sync-status-indicator-mobile');
                
                try {
                    if (indicator) indicator.innerHTML = `<span>Syncing Cloud...</span><i class="ti ti-refresh text-indigo-400 animate-spin"></i>`;
                    if (indicatorMob) indicatorMob.innerHTML = `<span>Syncing...</span><i class="ti ti-refresh text-indigo-400 animate-spin text-sm"></i>`;
                    
                    const dataPackage = [];
                    Object.keys(AppState.modules).forEach(modKey => {
                        if (Array.isArray(AppState.modules[modKey])) {
                            AppState.modules[modKey].forEach(item => {
                                dataPackage.push({ timestamp: item.id || Date.now(), module: modKey, payload: item });
                            });
                        }
                    });

                    // FIXED: Dropped 'no-cors' to allow clean handshake verification
                    await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ entries: dataPackage })
                    });

                    if (indicator) indicator.innerHTML = `<span>Cloud Synced</span><i class="ti ti-cloud-check text-green-400 text-sm"></i>`;
                    if (indicatorMob) {
                        indicatorMob.className = "flex items-center gap-1 bg-emerald-950 border border-emerald-500/30 text-emerald-400 px-2.5 py-1 rounded-lg text-xs font-bold";
                        indicatorMob.innerHTML = `<i class="ti ti-cloud-check text-sm"></i> <span>Live Sync</span>`;
                    }
                } catch (err) {
                    console.log("Cloud push exception, holding data in local device buffer.");
                }
            }
        };

        const GraphEngine = {
            renderDashboardCharts() {
                const ctx = document.getElementById('dashboardGlobalCanvas');
                if (!ctx) return;
                if (globalChartInstance) globalChartInstance.destroy();

                const currentTab = AppState.activeChartTab;
                let chartType = 'bar'; let chartData = { labels: [], datasets: [] };
                let chartOptions = { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } }, plugins: { legend: { position: 'bottom' } } };

                if (currentTab === 'programming') {
                    const topicMap = {};
                    AppState.modules.programming.forEach(l => topicMap[l.topic] = (topicMap[l.topic] || 0) + l.duration);
                    chartType = 'doughnut';
                    chartData = {
                        labels: Object.keys(topicMap).length ? Object.keys(topicMap) : ['No Data Studied'],
                        datasets: [{ data: Object.keys(topicMap).length ? Object.values(topicMap) : [1], backgroundColor: ['#8b5cf6', '#3b82f6', '#10b981', '#f59e0b'] }]
                    };
                } else if (currentTab === 'content') {
                    let done = 0; let pending = 0;
                    AppState.modules.content_creation.forEach(l => l.status === 'Done' ? done++ : pending++);
                    chartType = 'bar';
                    chartData = { labels: ['Done', 'Pending'], datasets: [{ label: 'Videos Production', data: [done, pending], backgroundColor: ['#10b981', '#f59e0b'] }] };
                } else if (currentTab === 'workout') {
                    const exMap = {};
                    AppState.modules.workout.forEach(l => exMap[l.exercise] = (exMap[l.exercise] || 0) + (l.sets * l.reps));
                    chartType = 'bar';
                    chartData = { labels: Object.keys(exMap), datasets: [{ label: 'Repetition Volume', data: Object.values(exMap), backgroundColor: ['#10b981', '#34d399'] }] };
                } else if (currentTab === 'finance') {
                    let inc = 0; let exp = 0;
                    AppState.modules.finance.forEach(l => l.flow === 'Income' ? inc += l.amount : exp += l.amount);
                    chartType = 'pie';
                    chartData = { labels: ['Income Cash Flow', 'Expenses Volume'], datasets: [{ data: [inc, exp], backgroundColor: ['#10b981', '#f43f5e'] }] };
                }

                globalChartInstance = new Chart(ctx, { type: chartType, data: chartData, options: chartOptions });
            },
            switchChartTab(tabId) {
                AppState.activeChartTab = tabId;
                document.querySelectorAll('.chart-tab-btn').forEach(btn => {
                    btn.className = btn.dataset.tabId === tabId ? "chart-tab-btn px-3 py-2 border-b-2 border-indigo-600 text-indigo-600 font-bold transition focus:outline-none" : "chart-tab-btn px-3 py-2 border-b-2 border-transparent text-slate-500 transition focus:outline-none";
                });
                this.renderDashboardCharts();
            }
        };

        const UIController = {
            init() { this.renderNavigation(); this.generateViewShells(); this.switchView(AppState.activeView); this.startGlobalClockEngine(); },

                    dBtn.addEventListener('click', () => this.switchView(key)); desktopNav.appendChild(dBtn);

                    const mBtn = document.createElement('button');
                    mBtn.className = `nav-btn-mobile flex flex-col items-center justify-center flex-1 min-w-[56px] py-1 text-slate-400 text-xs gap-0.5`;
                    mBtn.dataset.viewId = key; mBtn.innerHTML = `<i class="ti ${mod.icon} text-lg"></i><span class="text-[9px] tracking-tight">${mod.label}</span>`;
                    mBtn.addEventListener('click', () => this.switchView(key)); mobileNav.appendChild(mBtn);
                });
            },

                    if (key === 'dashboard') {
                        panel.innerHTML = `
                            <div class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-6 shadow-sm">
                                <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 border-b border-slate-100 pb-4 mb-6">
                                    <div><h2 class="text-xl font-bold text-slate-800">Core Engine Analytics</h2><p class="text-xs text-slate-500">Real-time lifestyle parameter streams.</p></div>
                                    <div class="flex border-b border-slate-200 text-xs sm:text-sm font-medium overflow-x-auto whitespace-nowrap">
                                        <button onclick="GraphEngine.switchChartTab('programming')" data-tab-id="programming" class="chart-tab-btn px-3 py-2 border-b-2 border-indigo-600 text-indigo-600 font-bold focus:outline-none">Programming</button>
                                        <button onclick="GraphEngine.switchChartTab('content')" data-tab-id="content" class="chart-tab-btn px-3 py-2 border-b-2 border-transparent text-slate-500 focus:outline-none">Content</button>
                                        <button onclick="GraphEngine.switchChartTab('workout')" data-tab-id="workout" class="chart-tab-btn px-3 py-2 border-b-2 border-transparent text-slate-500 focus:outline-none">Workouts</button>
                                        <button onclick="GraphEngine.switchChartTab('finance')" data-tab-id="finance" class="chart-tab-btn px-3 py-2 border-b-2 border-transparent text-slate-500 focus:outline-none">Finance Balance</button>
                                    </div>
                                </div>
                                <div class="relative w-full h-80 sm:h-96"><canvas id="dashboardGlobalCanvas"></canvas></div>
                            </div>
                            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                <div class="flex-1">
                                    <h3 class="text-sm font-black text-slate-800 uppercase tracking-wider mb-2 flex items-center gap-2"><i class="ti ti-cloud-computing text-indigo-600"></i> Cloud Auto-Sync Engine Registry</h3>
                                    <input type="password" id="webapp-url-input" placeholder="Paste deployment Web App URL link..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono mb-2">
                                    <button onclick="UIController.saveWebappUrlSettings()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs py-2 px-4 rounded-xl transition uppercase">Lock Sync Connection</button>

                                <div class="border-t sm:border-t-0 sm:border-l border-slate-200 pt-4 sm:pt-0 sm:pl-6">

                                    <button onclick="UIController.purgeLocalCacheSuite()" class="bg-rose-50 border border-rose-200 text-rose-700 hover:bg-rose-100 text-xs font-bold py-2 px-4 rounded-xl transition">Wipe Local Test Entries</button>
                                </div>
                            </div>

                    } else if (key === 'programming') {
                        panel.innerHTML = `

                                <div id="focus-clock-display" class="text-white text-7xl sm:text-8xl md:text-9xl font-black font-sans my-4">00:00</div>

                                        </div>

                                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Target Mins</label><input type="number" id="prog-duration" value="45" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none"></div>
                                            <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Problems Solved</label><input type="number" id="prog-problems" value="0" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none"></div>

                                        <button type="submit" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-3 px-4 rounded-xl text-sm flex items-center justify-center gap-2"><i class="ti ti-player-play"></i> Ignite Desk Focus Clock</button>
                                    </form>
                                </div>
                                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm lg:col-span-2 flex flex-col min-h-[400px]">
                                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="ti ti-history text-slate-500"></i> Technical Study Registry History</h3>
                                    <div class="flex-1 overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="border-b text-slate-400 text-xs font-bold bg-slate-50/75"><th class="py-3 px-4">Topic</th><th class="py-3 px-4">Duration</th><th class="py-3 px-4">Problems</th><th class="py-3 px-4">Action</th></tr></thead><tbody id="table-body-programming" class="text-sm divide-y"></tbody></table></div>
                                </div>
                            </div>
                        `;
                    } else if (key === 'content_creation') {
                        panel.innerHTML = `
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm lg:col-span-1">
                                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="ti ti-movie text-fuchsia-600"></i> Production Pipeline Log</h3>
                                    <form id="form-content" class="space-y-4">
                                        <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Project Video Title</label><input type="text" id="content-title" placeholder="e.g., DSA Day in Life Vlog" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none" required></div>
                                        <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Platform</label><select id="content-platform" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none"><option value="Instagram">Instagram</option><option value="LinkedIn">LinkedIn</option><option value="TikTok">TikTok</option><option value="YouTube">YouTube</option></select></div>
                                        <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Phase</label><select id="content-phase" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none"><option value="Scripting">Scripting</option><option value="Voice Recording">Voice Recording</option><option value="Video Shooting">Video Shooting</option><option value="Editing">Video Editing</option><option value="Thumbnail">Thumbnail Design</option><option value="Published">Published</option></select></div>
                                        <div><label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Pipeline Status</label><div class="grid grid-cols-2 gap-3"><label class="flex items-center justify-center py-2 border rounded-xl text-xs cursor-pointer bg-slate-50 has-[:checked]:bg-emerald-50"><input type="radio" name="content-status" value="Pending" class="hidden" checked> Pending</label><label class="flex items-center justify-center py-2 border rounded-xl text-xs cursor-pointer bg-slate-50 has-[:checked]:bg-emerald-50"><input type="radio" name="content-status" value="Done" class="hidden"> Done</label></div></div>
                                        <button type="submit" class="w-full bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-bold py-3 px-4 rounded-xl text-sm flex items-center justify-center gap-2"><i class="ti ti-folder-plus"></i> Append Strategy State</button>
                                    </form>
                                </div>
                                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm lg:col-span-2 flex flex-col min-h-[400px]">
                                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="ti ti-brand-youtube text-slate-500"></i> Video Operations Registry</h3>
                                    <div class="flex-1 overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="border-b text-slate-400 text-xs font-bold bg-slate-50/75"><th class="py-3 px-4">Project</th><th class="py-3 px-4">Platform</th><th class="py-3 px-4">Phase</th><th class="py-3 px-4">Status</th><th class="py-3 px-4">Action</th></tr></thead><tbody id="table-body-content" class="text-sm divide-y"></tbody></table></div>
                                </div>
                            </div>
                        `;
                    } else if (key === 'books') {
                        panel.innerHTML = `

                                    <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="ti ti-bookmark text-amber-600"></i> Log Reading Session</h3>
                                    <form id="form-books" class="space-y-4">

                overlay.onclick = (e) => {
                    if (e.target.closest('button')) return;
                    const currentTime = new Date().getTime(); const tapLength = currentTime - lastTap;
                    if (tapLength < 300 && tapLength > 0) this.cancelFocusSession();
                    lastTap = currentTime;
                };
            },

            updateFocusClockDisplay() {
                const display = document.getElementById('focus-clock-display'); if (!display) return;
                const mins = Math.floor(AppState.focusSession.remainingSeconds / 60); const secs = AppState.focusSession.remainingSeconds % 60;
                display.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            },

            completeFocusSession() {
                const entry = {
                    id: Date.now(), date: new Date().toLocaleDateString(), topic: AppState.focusSession.activeTopic,
                    duration: AppState.focusSession.totalDurationMins, problems: AppState.focusSession.cachedProblems,
                    platform: AppState.focusSession.cachedPlatform, difficulty: AppState.focusSession.cachedDifficulty, notes: AppState.focusSession.cachedNotes
                };
                AppState.modules.programming.unshift(entry);
                StorageController.saveToDisk(); document.getElementById('focus-overlay').classList.add('hidden');
                this.renderModuleTables(); if(AppState.activeView === 'dashboard') GraphEngine.renderDashboardCharts();
                StorageController.syncToCloud(); alert(`Focus blocks verified & saved!`);
            },

            cancelFocusSession() {
                if (confirm("End focus session? Data will be lost.")) {
                    clearInterval(AppState.focusSession.timerId); document.getElementById('focus-overlay').classList.add('hidden');
                }
            },

            startGlobalClockEngine() {
                setInterval(() => {
                    const clock = document.getElementById('widget-clock'); const dateEl = document.getElementById('widget-date');
                    const dayEl = document.getElementById('widget-date-day'); const now = new Date();
                    if (clock) {
                        clock.innerText = now.toTimeString().split(' ')[0];
                        if(dateEl) dateEl.innerText = now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                        if(dayEl) dayEl.innerText = now.toLocaleDateString('en-US', { weekday: 'long' });
                    }
                }, 1000);
            },

            switchView(viewId) {
                if (!SystemModulesDefinition[viewId]) return; AppState.activeView = viewId;
                Object.keys(SystemModulesDefinition).forEach(key => {
                    const panel = document.getElementById(`view-panel-${key}`);
                    if (panel) key === viewId ? panel.classList.remove('hidden') : panel.className = 'hidden space-y-6';
                });
                document.querySelectorAll('.nav-btn-desktop').forEach(btn => {
                    btn.dataset.viewId === viewId ? btn.classList.add('bg-indigo-600', 'text-white') : btn.classList.remove('bg-indigo-600', 'text-white');
                });
                if (viewId === 'dashboard') {
                    GraphEngine.renderDashboardCharts();
                    setTimeout(() => { const inputField = document.getElementById('webapp-url-input'); if (inputField) inputField.value = AppState.settings.googleWebappUrl; }, 50);
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            toggleContentStatus(id) {
                const item = AppState.modules.content_creation.find(c => c.id === id);
                if (item) {
                    item.status = (item.status === 'Done') ? 'Pending' : 'Done';
                    StorageController.saveToDisk(); this.renderModuleTables();
                    if(AppState.activeView === 'dashboard') GraphEngine.renderDashboardCharts();
                    StorageController.syncToCloud();
                }
            },

            toggleHabitMatrixDay(habitId, dayOffsetStr) {
                const habit = AppState.modules.habits.find(h => h.id === habitId);
                if (habit) {
                    if (!habit.history) habit.history = {};
                    habit.history[dayOffsetStr] = !habit.history[dayOffsetStr];
                    StorageController.saveToDisk(); this.renderModuleTables();
                    StorageController.syncToCloud();
                }
            },

            renderModuleTables() {
                const tbodyProg = document.getElementById('table-body-programming');
                if (tbodyProg) {
                    tbodyProg.innerHTML = AppState.modules.programming.map(log => `
                        <tr><td class="py-3 px-4 font-semibold">${log.topic}</td><td class="py-3 px-4 font-mono">${log.duration}m</td><td class="py-3 px-4"><span class="bg-violet-50 text-violet-700 font-bold px-2 py-0.5 rounded text-xs">${log.problems} Solved</span></td><td class="py-3 px-4"><button onclick="UIController.deleteLog('programming', ${log.id})" class="text-slate-400 hover:text-rose-600"><i class="ti ti-trash"></i></button></td></tr>
                    `).join('');
                }

                const tbodyContent = document.getElementById('table-body-content');
                if (tbodyContent) {
                    tbodyContent.innerHTML = AppState.modules.content_creation.map(log => `
                        <tr><td class="py-3 px-4 font-semibold">${log.title}</td><td class="py-3 px-4"><span class="bg-slate-900 text-white px-2 py-0.5 rounded text-xs">${log.platform}</span></td><td class="py-3 px-4 text-fuchsia-600 font-bold">${log.phase}</td><td class="py-3 px-4"><button onclick="UIController.toggleContentStatus(${log.id})" class="px-2 py-0.5 border rounded-lg text-xs font-black ${log.status==='Done'?'bg-emerald-50 text-emerald-700':'bg-amber-50 text-amber-700'}">${log.status}</button></td><td class="py-3 px-4"><button onclick="UIController.deleteLog('content_creation', ${log.id})" class="text-slate-400 hover:text-rose-600"><i class="ti ti-trash"></i></button></td></tr>
                    `).join('');
                }

                const tbodyWork = document.getElementById('table-body-workout');
                if (tbodyWork) {
                    tbodyWork.innerHTML = AppState.modules.workout.map(log => `
                        <tr><td class="py-3 px-4 font-bold text-slate-800"><i class="ti ti-bolt text-emerald-500"></i> ${log.exercise}</td><td class="py-3 px-4 text-xs">${log.sets}s &times; ${log.reps}r</td><td class="py-3 px-4"><span class="bg-emerald-50 text-emerald-700 font-mono font-bold px-2 py-0.5 rounded text-xs">${log.sets * log.reps} Vol</span></td><td class="py-3 px-4"><button onclick="UIController.deleteLog('workout', ${log.id})" class="text-slate-400 hover:text-rose-600"><i class="ti ti-trash"></i></button></td></tr>
                    `).join('');
                }

                const tbodyBooks = document.getElementById('table-body-books');
                if (tbodyBooks) {
                    let totalPages = 0;
                    tbodyBooks.innerHTML = AppState.modules.books.map(log => {
                        totalPages += log.pages; const percentage = Math.min(Math.round((log.pages / log.total) * 100), 100);
                        return `
                            <tr>
                                <td class="py-3.5 px-4 font-semibold">${log.title}</td>
                                <td class="py-3.5 px-4 w-48">
                                    <div class="flex items-center gap-2"><div class="w-full bg-slate-100 h-2 rounded-full"><div class="bg-amber-500 h-2 rounded-full" style="width: ${percentage}%"></div></div><span class="text-xs font-mono font-bold">${percentage}%</span></div>
                                    <span class="text-[10px] text-slate-400 font-mono">${log.pages}/${log.total} pgs</span>
                                </td>
                                <td class="py-3.5 px-4 text-slate-500 text-xs max-w-xs truncate">${log.notes || '<span class="text-slate-300 italic">None</span>'}</td>
                                <td class="py-3.5 px-4"><button onclick="UIController.deleteLog('books', ${log.id})" class="text-slate-400 hover:text-rose-600"><i class="ti ti-trash"></i></button></td>
                            </tr>
                        `;
                    }).join('');
                    const countEl = document.getElementById('book-count-card'); if (countEl) countEl.innerText = AppState.modules.books.length;
                    const pagesEl = document.getElementById('book-pages-card'); if (pagesEl) pagesEl.innerText = totalPages.toLocaleString();
                }

                const tbodyFin = document.getElementById('table-body-finance');
                if (tbodyFin) {
                    let totalInc = 0; let totalExp = 0;
                    tbodyFin.innerHTML = AppState.modules.finance.map(log => {
                        if (log.flow === 'Income') totalInc += log.amount; else totalExp += log.amount;
                        return `
                            <tr class="hover:bg-slate-50/50">
                                <td class="py-3.5 px-4 font-black ${log.flow==='Income'?'text-emerald-600':'text-slate-900'}">Rs. ${log.amount.toLocaleString()}</td>
                                <td class="py-3.5 px-4"><span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-xs">${log.category}</span></td>
                                <td class="py-3.5 px-4"><span class="px-2.5 py-0.5 rounded text-[10px] font-bold border ${log.flow==='Income'?'bg-emerald-50 text-emerald-700 border-emerald-200':'bg-rose-50 text-rose-700 border-rose-200'}">${log.flow}</span></td>
                                <td class="py-3.5 px-4 text-slate-400 text-xs">${log.date}</td>
                                <td class="py-3.5 px-4"><button onclick="UIController.deleteLog('finance', ${log.id})" class="text-slate-400 hover:text-rose-600"><i class="ti ti-trash"></i></button></td>
                            </tr>
                        `;
                    }).join('');
                    const incEl = document.getElementById('fin-inc-board'); const expEl = document.getElementById('fin-exp-board');
                    const balEl = document.getElementById('fin-bal-board'); const iconBox = document.getElementById('fin-bal-icon-box');
                    if (incEl) incEl.innerText = `Rs. ${totalInc.toLocaleString()}`; if (expEl) expEl.innerText = `Rs. ${totalExp.toLocaleString()}`;
                    const netBalance = totalInc - totalExp;
                    if (balEl) {
                        balEl.innerText = `Rs. ${netBalance.toLocaleString()}`;
                        if (netBalance >= 0) { balEl.className = "text-lg font-black text-emerald-600"; if(iconBox) iconBox.className = "p-3 bg-emerald-50 text-emerald-600 rounded-xl text-xl"; } 
                        else { balEl.className = "text-lg font-black text-rose-600"; if(iconBox) iconBox.className = "p-3 bg-rose-50 text-rose-600 rounded-xl text-xl"; }
                    }
                }

                const gridNotes = document.getElementById('notes-grid-layout');
                if (gridNotes) {
                    gridNotes.innerHTML = AppState.modules.notes.map(note => `
                        <div class="bg-slate-50 rounded-xl p-4 border border-slate-200/80 shadow-sm flex flex-col justify-between hover:border-teal-300 transition group relative">
                            <div><div class="flex items-start justify-between gap-2 mb-2"><span class="text-[10px] font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded border border-teal-100 uppercase tracking-wider">${note.category}</span><span class="text-[10px] font-mono text-slate-400">${note.date}</span></div><h4 class="font-bold text-slate-800 text-sm mb-1 tracking-tight">${note.title}</h4><p class="text-xs text-slate-600 leading-relaxed whitespace-pre-wrap">${note.content}</p></div>
                            <div class="mt-4 flex justify-end"><button onclick="UIController.deleteLog('notes', ${note.id})" class="text-slate-400 hover:text-rose-600 transition p-1 text-xs"><i class="ti ti-trash"></i> Delete</button></div>
                        </div>
                    `).join('');
                    if (AppState.modules.notes.length === 0) gridNotes.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-xs italic">Vault empty.</div>`;
                }

                const habitsGridContainer = document.getElementById('habits-matrix-board-container');
                if (habitsGridContainer) {
                    const habitsList = AppState.modules.habits;
                    if (habitsList.length === 0) {
                        habitsGridContainer.innerHTML = `<div class="py-8 text-center text-slate-400 text-xs italic">No discipline targets tracked. Instantiate one on the left.</div>`;
                    } else {
                        const dateArray = [];
                        for(let d=6; d>=0; d--) {
                            const tempDate = new Date(); tempDate.setDate(tempDate.getDate() - d);
                            dateArray.push({ label: tempDate.toLocaleDateString('en-US', { weekday: 'short' }), key: tempDate.toDateString() });
                        }

                        habitsGridContainer.innerHTML = habitsList.map(habit => `
                            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                <div><h4 class="font-bold text-slate-800 text-sm tracking-tight">${habit.name}</h4><span class="text-[10px] uppercase font-mono text-slate-400 font-bold tracking-widest">Discipline String</span></div>
                                <div class="flex gap-2 items-center">
                                    ${dateArray.map(day => {
                                        const isDone = habit.history && habit.history[day.key] === true;
                                        return `
                                            <button onclick="UIController.toggleHabitMatrixDay(${habit.id}, '${day.key}')" class="w-10 h-12 rounded-xl border flex flex-col items-center justify-center transition-all duration-150 ${isDone ? 'bg-cyan-500 text-white border-cyan-600 shadow-sm font-bold' : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300'}">
                                                <span class="text-[9px] uppercase tracking-tighter opacity-60">${day.label}</span>
                                                <i class="ti ${isDone ? 'ti-square-check' : 'ti-square'} text-sm mt-0.5"></i>
                                            </button>
                                        `;
                                    }).join('')}
                                    <button onclick="UIController.deleteLog('habits', ${habit.id})" class="text-slate-300 hover:text-rose-600 pl-2 text-md transition"><i class="ti ti-trash"></i></button>
                                </div>
                            </div>
                        `).join('');
                    }
                }
            },

            deleteLog(moduleKey, id) {
                if(confirm("Erase entry permanently?")) {
                    AppState.modules[moduleKey] = AppState.modules[moduleKey].filter(item => item.id !== id);
                    StorageController.saveToDisk(); this.renderModuleTables();
                    if(AppState.activeView === 'dashboard') GraphEngine.renderDashboardCharts();
                    StorageController.syncToCloud();
                }
            }
        };

        const CloudFetchEngine = {
            async downloadLatestCloudData() {
                const url = AppState.settings.googleWebappUrl;
                if (!url || !navigator.onLine) return; 

                const indicator = document.getElementById('sync-status-indicator');
                const indicatorMob = document.getElementById('sync-status-indicator-mobile');

                try {
                    if (indicator) indicator.innerHTML = `<span>Pulling Cloud...</span><i class="ti ti-refresh text-indigo-400 animate-spin"></i>`;
                    if (indicatorMob) indicatorMob.innerHTML = `<span>Pulling...</span><i class="ti ti-refresh text-indigo-400 animate-spin text-sm"></i>`;

                    // FIXED: Read standard raw fetch instead of blind no-cors routing
                    const response = await fetch(url);
                    const cloudData = await response.json();
                    
                    if (cloudData && cloudData.entries) {
                        // Rebuild your local device storage map with the incoming sheet records
                        cloudData.entries.forEach(entry => {
                            const targetModule = AppState.modules[entry.module];
                            if (Array.isArray(targetModule)) {
                                const itemExists = targetModule.some(localItem => localItem.id === entry.payload.id);
                                if (!itemExists) {
                                    targetModule.push(entry.payload);
                                }
                            }
                        });
                        // Sort logs to keep the newest entries at the top of the timeline
                        Object.keys(AppState.modules).forEach(key => {
                            if (Array.isArray(AppState.modules[key])) {
                                AppState.modules[key].sort((a, b) => b.id - a.id);
                            }
                        });
                        StorageController.saveToDisk();
                    }
                    
                    UIController.renderModuleTables();
                    if (AppState.activeView === 'dashboard') GraphEngine.renderDashboardCharts();

                    if (indicator) indicator.innerHTML = `<span>Cloud Synced</span><i class="ti ti-cloud-check text-green-400 text-sm"></i>`;
                    if (indicatorMob) {
                        indicatorMob.className = "flex items-center gap-1 bg-emerald-950 border border-emerald-500/30 text-emerald-400 px-2.5 py-1 rounded-lg text-xs font-bold";
                        indicatorMob.innerHTML = `<i class="ti ti-cloud-check text-sm"></i> <span>Live Sync</span>`;
                    }
                } catch (err) {
                    console.log("Cloud parsing standby: Network route cleared but spreadsheet records empty yet.");
                }
            }
        };

        // MODIFIED: Robust standalone initialization sequence with crash safeguards
        document.addEventListener("DOMContentLoaded", async () => {
            StorageController.init(); 
            UIController.init();
            
            // Safe bracket: Keeps layout operational offline by skipping blocking network hooks
            try {
                if (navigator.onLine) {
                    await CloudFetchEngine.downloadLatestCloudData();
                } else {
                    console.log("Offline mode active. Running native device buffer shell cleanly.");
                }
            } catch (networkError) {
                console.log("Cloud sync standby - maintaining sandbox view state:", networkError);
            }

            // REGISTER PROGRESSIVE WEB APP HANDSHAKE
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('./sw.js');
                    console.log("Core Offline Engine Online!");
                } catch (err) {
                    console.log("PWA registration standby:", err);
                }
            }
        });
    </script>
</body>
</html>
